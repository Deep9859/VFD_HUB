allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Some third-party Flutter plugins reference `flutter.*` inside their `android { }` block.
// The Android Gradle Plugin treats unknown identifiers inside that block as properties on the
// `android` extension, so we provide a compatible `android.flutter` object for all Android
// (app + library) subprojects.
ext.flutter = [
        compileSdkVersion: 36,
        targetSdkVersion : 36,
        minSdkVersion    : 24,
        ndkVersion       : "26.1.10909125",
]

subprojects { project ->
    project.plugins.withId('com.android.application') {
        project.android.ext.flutter = rootProject.ext.flutter
    }
    project.plugins.withId('com.android.library') {
        project.android.ext.flutter = rootProject.ext.flutter
    }

    project.configurations.configureEach { cfg ->
        cfg.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion('1.9.24')
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
