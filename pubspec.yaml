name: vfd_param_app
description: "VFD Hub - Your VFD Parameter Management Hub for Industrial Automation"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.3
  file_picker: ^8.0.3
  path: ^1.9.0
  flutter_pdfview: ^1.4.4
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  google_fonts: ^6.1.0

  # Security
  shared_preferences: ^2.3.2
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.0.0
  open_file: ^3.3.2
  url_launcher: ^6.2.6
  excel: ^4.0.6
  
  # QR Code Scanner
  mobile_scanner: ^5.2.3
  permission_handler: ^11.3.1
  
  # Voice Commands
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#2196F3"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
